<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Admin</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #c6e3fa; }
    .return-to-portal { position: fixed; top: 18px; left: 18px; z-index: 5; min-width: 150px; min-height: 48px; padding: 0 18px; border: 2px solid #397ef4; border-radius: 9px; color: #174e86; background: rgba(255,255,255,.96); font: 700 15px "Segoe UI", Arial, sans-serif; cursor: pointer; box-shadow: 0 5px 14px rgba(32,75,126,.2); }
    .return-to-portal:hover { color: #fff; border-color: #397ef4; background: #397ef4; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <button class="return-to-portal" type="button" onclick="window.location.href='index.html'"><span aria-hidden="true">&#8592;</span> Return to Portal</button>
  <iframe id="assessmentPortal" src="index.html?assessmentOnly=1" title="Assessment Endorsement"></iframe>
  <script>
    const portalFrame = document.querySelector('#assessmentPortal');
    portalFrame.addEventListener('load', () => {
      portalFrame.contentDocument?.body.classList.add('assessment-only');
    });
  </script>
</body>
</html>
